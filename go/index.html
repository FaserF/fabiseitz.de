<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortlinks &amp; Empfehlungen — Fabian Seitz</title>
    <meta name="description" content="Offizielle Shortlinks, Hardware-Empfehlungen und Partnerlinks von Fabian Seitz (fabiseitz.de/go und go.fabiseitz.de).">
    <meta name="robots" content="noindex, follow">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon/favicon-16x16.png">

    <!-- CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">

    <!-- Instant Client-Side Fallback for ?to=slug or #slug -->
    <script>
      (function() {
        var map = {
          'tr': 'https://refnocode.trade.re/bcnklq6w',
          'traderepublic': 'https://refnocode.trade.re/bcnklq6w',
          'finanzfluss': 'https://www.finanzfluss.de/copilot/',
          'ledger': 'https://shop.ledger.com',
          'audible': 'https://www.amazon.de/hz/audible/mlp',
          'sponsor': 'https://github.com/sponsors/FaserF',
          'ha-hardware': 'https://www.home-assistant.io/green/',
          'ha-router': 'https://www.home-assistant.io/integrations/openwrt/',
          'ha-shelly': 'https://www.home-assistant.io/integrations/shelly/',
          'ha-tasmota': 'https://www.home-assistant.io/integrations/tasmota/',
          'ha-zigbee': 'https://www.home-assistant.io/connectzbt1/',
          'ha-plugs': 'https://www.home-assistant.io/integrations/#energy',
          'ha-vacuum': 'https://www.home-assistant.io/integrations/#vacuum'
        };
        var params = new URLSearchParams(window.location.search);
        var targetSlug = (params.get('to') || window.location.hash.replace('#', '')).toLowerCase().trim();
        if (targetSlug && map[targetSlug]) {
          window.location.replace(map[targetSlug]);
        }
      })();
    </script>

    <style>
      .shortlink-hero {
        padding: 5rem 0 2rem;
        text-align: center;
      }
      .domain-badges {
        display: inline-flex;
        gap: 0.75rem;
        margin: 1.25rem 0;
        flex-wrap: wrap;
        justify-content: center;
      }
      .domain-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(14, 165, 233, 0.12);
        color: #0ea5e9;
        border: 1px solid rgba(14, 165, 233, 0.3);
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        font-family: monospace;
        font-size: 0.95rem;
      }
      .filter-bar {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 800px;
        margin: 1.5rem auto 2.5rem;
      }
      .search-input-wrapper {
        position: relative;
        width: 100%;
      }
      .search-input-wrapper i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.25rem;
        color: var(--text-color-light, #94a3b8);
      }
      .search-input {
        width: 100%;
        padding: 0.85rem 1rem 0.85rem 3rem;
        border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(15, 23, 42, 0.6);
        color: #fff;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search-input:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
      }
      .category-pills {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      .cat-pill {
        padding: 0.4rem 0.9rem;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
      }
      .cat-pill:hover, .cat-pill.active {
        background: #0ea5e9;
        color: #fff;
        border-color: #0ea5e9;
      }
      .links-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 1.5rem;
        max-width: 1100px;
        margin: 0 auto 4rem;
      }
      .link-card {
        background: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1rem;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        backdrop-filter: blur(12px);
        transition: transform 0.2s, border-color 0.2s;
      }
      .link-card:hover {
        transform: translateY(-4px);
        border-color: rgba(14, 165, 233, 0.4);
      }
      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 0.75rem;
      }
      .card-icon {
        width: 44px;
        height: 44px;
        border-radius: 0.75rem;
        background: rgba(14, 165, 233, 0.15);
        color: #0ea5e9;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }
      .card-cat {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.2rem 0.6rem;
        border-radius: 0.4rem;
        background: rgba(255, 255, 255, 0.06);
        color: #cbd5e1;
      }
      .card-title {
        font-size: 1.15rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        color: #f8fafc;
      }
      .card-desc {
        font-size: 0.88rem;
        color: #94a3b8;
        line-height: 1.4;
        margin-bottom: 1.25rem;
        flex-grow: 1;
      }
      .slug-pills {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .slug-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 0.45rem 0.75rem;
        border-radius: 0.5rem;
        font-family: monospace;
        font-size: 0.82rem;
        color: #38bdf8;
      }
      .copy-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        cursor: pointer;
        padding: 0.2rem 0.4rem;
        border-radius: 0.3rem;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        transition: color 0.15s, background 0.15s;
      }
      .copy-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
      }
      .visit-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        padding: 0.65rem 1rem;
        border-radius: 0.6rem;
        background: #0ea5e9;
        color: #fff;
        font-weight: 500;
        font-size: 0.9rem;
        text-decoration: none;
        transition: background 0.2s;
      }
      .visit-btn:hover {
        background: #0284c7;
      }
    </style>
</head>
<body class="dark-theme">
    <!--===== HEADER =====-->
    <header class="l-header">
        <nav class="nav bd-grid">
            <div>
                <a href="../index.html" class="nav__logo">Fabian Seitz</a>
            </div>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item"><a href="../index.html" class="nav__link"><i class='bx bx-home'></i> Startseite</a></li>
                    <li class="nav__item"><a href="../cv.html" class="nav__link"><i class='bx bx-id-card'></i> Lebenslauf</a></li>
                    <li class="nav__item"><a href="../systems.html" class="nav__link"><i class='bx bx-server'></i> Systeme</a></li>
                    <li class="nav__item"><a href="index.html" class="nav__link active-link"><i class='bx bx-link'></i> Shortlinks</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="l-main bd-grid">
        <!--===== HERO =====-->
        <section class="shortlink-hero">
            <h1 class="section-title">URL Shortener &amp; Empfehlungen</h1>
            <p class="section-subtitle">Zentrales Shortlink-Gateway mit weltweiten Cloudflare Edge Redirects</p>

            <div class="domain-badges">
                <span class="domain-badge"><i class='bx bx-globe'></i> go.fabiseitz.de/{slug}</span>
                <span class="domain-badge"><i class='bx bx-link-alt'></i> fabiseitz.de/go/{slug}</span>
            </div>

            <div class="filter-bar">
                <div class="search-input-wrapper">
                    <i class='bx bx-search'></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Nach Slug, Name oder Kategorie suchen (z.B. tr, shelly, zigbee)...">
                </div>
                <div class="category-pills" id="categoryPills">
                    <button class="cat-pill active" data-cat="all">Alle</button>
                    <button class="cat-pill" data-cat="Smart Home">Smart Home</button>
                    <button class="cat-pill" data-cat="Finanzen">Finanzen</button>
                    <button class="cat-pill" data-cat="Netzwerk">Netzwerk</button>
                    <button class="cat-pill" data-cat="Security">Security</button>
                    <button class="cat-pill" data-cat="Medien">Medien</button>
                    <button class="cat-pill" data-cat="Open Source">Open Source</button>
                </div>
            </div>
        </section>

        <!--===== LINKS GRID =====-->
        <section>
            <div class="links-grid" id="linksGrid">
                <!-- Dynamically populated via JavaScript -->
            </div>
        </section>
    </main>

    <!--===== FOOTER =====-->
    <footer class="footer">
        <div class="footer__container bd-grid">
            <p class="footer__copy">&#169; 2026 Fabian Seitz. All rights reserved.</p>
        </div>
    </footer>

    <!--===== SCRIPT =====-->
    <script>
      const SHORTLINKS = [
        {
          slug: 'tr',
          title: 'Trade Republic',
          description: 'Zinsen auf Cash-Guthaben & kostenlose monatliche ETF-Sparpläne.',
          category: 'Finanzen',
          icon: 'bx-trending-up',
          target: 'https://refnocode.trade.re/bcnklq6w'
        },
        {
          slug: 'finanzfluss',
          title: 'Finanzfluss Copilot',
          description: 'Portfolio-Tracking, Performance-Analyse & Vermögensübersicht.',
          category: 'Finanzen',
          icon: 'bx-pie-chart-alt-2',
          target: 'https://www.finanzfluss.de/copilot/'
        },
        {
          slug: 'ledger',
          title: 'Ledger Hardware Wallet',
          description: 'Sichere Offline-Verwahrung für Krypto-Assets & Web3.',
          category: 'Security',
          icon: 'bx-shield-quarter',
          target: 'https://shop.ledger.com'
        },
        {
          slug: 'audible',
          title: 'Audible Hörbücher',
          description: 'Hörbücher, Podcasts & Audio-Features im Monatsabo.',
          category: 'Medien',
          icon: 'bx-headphone',
          target: 'https://www.amazon.de/hz/audible/mlp'
        },
        {
          slug: 'sponsor',
          title: 'GitHub Sponsors (@FaserF)',
          description: 'Unterstützung für Open-Source HACS-Integrationen, Tools & Bots.',
          category: 'Open Source',
          icon: 'bx-heart',
          target: 'https://github.com/sponsors/FaserF'
        },
        {
          slug: 'ha-hardware',
          title: 'Home Assistant Green / Yellow',
          description: 'Offizielle Hardware-Appliances für den 100% lokalen Smart-Home Betrieb.',
          category: 'Smart Home',
          icon: 'bx-chip',
          target: 'https://www.home-assistant.io/green/'
        },
        {
          slug: 'ha-zigbee',
          title: 'Home Assistant Connect ZBT-1',
          description: 'Offizieller Zigbee 3.0 & Thread/Matter Multiprotokoll USB-Koordinator.',
          category: 'Smart Home',
          icon: 'bx-broadcast',
          target: 'https://www.home-assistant.io/connectzbt1/'
        },
        {
          slug: 'ha-router',
          title: 'OpenWrt Hardware & Router',
          description: 'Empfohlene Router-Hardware für VLANs, Firewall & ha-openwrt.',
          category: 'Netzwerk',
          icon: 'bx-wifi',
          target: 'https://www.home-assistant.io/integrations/openwrt/'
        },
        {
          slug: 'ha-shelly',
          title: 'Shelly Smart Energy & Relais',
          description: 'Shelly 3EM, Plus & Pro Relais zur lückenlosen Strommessung.',
          category: 'Smart Home',
          icon: 'bx-zap',
          target: 'https://www.home-assistant.io/integrations/shelly/'
        },
        {
          slug: 'ha-tasmota',
          title: 'Tasmota Smart Plugs',
          description: 'Vollständig lokale WLAN-Steckdosen ohne Cloud-Zwang.',
          category: 'Smart Home',
          icon: 'bx-plug',
          target: 'https://www.home-assistant.io/integrations/tasmota/'
        },
        {
          slug: 'ha-plugs',
          title: 'Tuya/Matter Smart Plugs',
          description: 'Energie-Monitoring Steckdosen für Balkonkraftwerke & Geräte.',
          category: 'Smart Home',
          icon: 'bx-bolt-circle',
          target: 'https://www.home-assistant.io/integrations/#energy'
        },
        {
          slug: 'ha-vacuum',
          title: 'Valetudo Saugroboter',
          description: 'Cloud-freie Saugroboter mit lokaler Map-Steuerung in Home Assistant.',
          category: 'Smart Home',
          icon: 'bx-navigation',
          target: 'https://www.home-assistant.io/integrations/#vacuum'
        }
      ];

      function renderCards(items) {
        const grid = document.getElementById('linksGrid');
        if (!items.length) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem;">Keine passenden Shortlinks gefunden.</div>';
          return;
        }

        grid.innerHTML = items.map(item => `
          <div class="link-card">
            <div>
              <div class="card-top">
                <div class="card-icon"><i class='bx ${item.icon}'></i></div>
                <span class="card-cat">${item.category}</span>
              </div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-desc">${item.description}</p>
            </div>

            <div>
              <div class="slug-pills">
                <div class="slug-pill">
                  <span>go.fabiseitz.de/${item.slug}</span>
                  <button class="copy-btn" onclick="copyText('https://go.fabiseitz.de/${item.slug}', this)" title="Kopieren">
                    <i class='bx bx-copy'></i>
                  </button>
                </div>
                <div class="slug-pill">
                  <span>fabiseitz.de/go/${item.slug}</span>
                  <button class="copy-btn" onclick="copyText('https://fabiseitz.de/go/${item.slug}', this)" title="Kopieren">
                    <i class='bx bx-copy'></i>
                  </button>
                </div>
              </div>

              <a href="https://go.fabiseitz.de/${item.slug}" target="_blank" rel="noopener noreferrer" class="visit-btn">
                <span>Ziel öffnen</span>
                <i class='bx bx-right-arrow-alt'></i>
              </a>
            </div>
          </div>
        `).join('');
      }

      function copyText(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
          const original = btn.innerHTML;
          btn.innerHTML = "<i class='bx bx-check' style='color:#10b981'></i>";
          setTimeout(() => { btn.innerHTML = original; }, 1800);
        });
      }

      // Filter handling
      let activeCategory = 'all';
      let searchQuery = '';

      function filterLinks() {
        const filtered = SHORTLINKS.filter(item => {
          const matchesCat = activeCategory === 'all' || item.category === activeCategory;
          const query = searchQuery.toLowerCase().trim();
          const matchesSearch = !query || 
            item.slug.toLowerCase().includes(query) ||
            item.title.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query);
          return matchesCat && matchesSearch;
        });
        renderCards(filtered);
      }

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        filterLinks();
      });

      document.getElementById('categoryPills').addEventListener('click', (e) => {
        if (!e.target.classList.contains('cat-pill')) return;
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        e.target.classList.add('active');
        activeCategory = e.target.dataset.cat;
        filterLinks();
      });

      // Initial render
      renderCards(SHORTLINKS);
    </script>
</body>
</html>
